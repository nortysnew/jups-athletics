<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUPS your performance | Choose your country</title>
<meta name="description" content="Choose the JUPS waitlist for the US or Germany.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f1ea;
    --paper-2:#fff;
    --line:#e6e1d7;
    --line-2:#d7d1c5;
    --kit:#191c22;
    --kit-dim:#5a616b;
    --muted:#8b929c;
    --mint:#22c27f;
    --mint-deep:#0f9e63;
    --orange:#ef933f;
    --maxw:760px;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    color:var(--kit);
    font-family:"Helvetica Neue",Helvetica,-apple-system,"Segoe UI",Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(820px 480px at 50% -10%,rgba(34,194,127,.16),transparent 60%),
      radial-gradient(620px 380px at 88% 4%,rgba(239,147,63,.14),transparent 62%),
      var(--paper);
  }
  .disp{
    font-family:"Saira Condensed","Arial Narrow",Impact,"Arial Black",sans-serif;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.01em;
    line-height:.9;
  }
  .mono{
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:.63rem;
    letter-spacing:.2em;
    text-transform:uppercase;
  }
  .drop{
    text-align:center;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    color:#7c838d;
    background:rgba(0,0,0,.022);
  }
  .drop b{color:var(--kit)}
  nav{
    display:flex;
    align-items:center;
    justify-content:center;
    max-width:var(--maxw);
    margin:0 auto;
    padding:22px;
  }
  .wordmark{
    display:flex;
    align-items:center;
    gap:.38em;
    color:var(--kit);
    text-decoration:none;
  }
  .brandmark{display:block;width:clamp(170px,42vw,250px);height:auto}
  .performance{
    font-size:clamp(.9rem,3.5vw,1.35rem);
    line-height:.92;
    letter-spacing:.035em;
    text-align:left;
  }
  main{
    width:min(100%,var(--maxw));
    margin:0 auto;
    padding:34px 22px 80px;
    text-align:center;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:9px;
    margin-bottom:18px;
    padding:8px 15px;
    color:var(--kit-dim);
    background:var(--paper-2);
    border:1px solid var(--line-2);
    border-radius:100px;
  }
  .eyebrow::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--orange);
  }
  h1{
    margin:0;
    font-size:clamp(3rem,11vw,5.3rem);
  }
  .intro{
    margin:18px auto 34px;
    max-width:30ch;
    color:var(--kit-dim);
    font-size:1.05rem;
  }
  .product-hero{
    position:relative;
    overflow:hidden;
    max-width:680px;
    margin:0 auto 22px;
    aspect-ratio:16/9;
    border:1px solid var(--line-2);
    border-radius:18px;
    background:#47602e;
    box-shadow:0 18px 42px -28px rgba(20,23,28,.5);
  }
  .product-hero img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .product-hero::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(90deg,rgba(25,28,34,.14),transparent 45%);
  }
  .countries{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
    max-width:560px;
    margin:0 auto;
  }
  .country{
    display:flex;
    min-height:220px;
    padding:28px 20px 24px;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--kit);
    text-decoration:none;
    background:rgba(255,255,255,.86);
    border:1px solid var(--line-2);
    border-radius:18px;
    box-shadow:0 14px 34px -24px rgba(20,23,28,.35);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .country:hover,
  .country:focus-visible{
    transform:translateY(-3px);
    border-color:var(--mint);
    box-shadow:0 18px 38px -22px rgba(15,158,99,.45);
  }
  .country:focus-visible{
    outline:3px solid rgba(34,194,127,.22);
    outline-offset:3px;
  }
  .flag{
    width:120px;
    aspect-ratio:3/2;
    overflow:hidden;
    border:1px solid rgba(25,28,34,.17);
    border-radius:8px;
    box-shadow:0 8px 20px -12px rgba(25,28,34,.45);
  }
  .flag svg{display:block;width:100%;height:100%}
  .country-name{
    margin-top:20px;
    font-size:1.85rem;
  }
  .arrow{
    margin-top:7px;
    color:var(--mint-deep);
    font-size:.7rem;
    letter-spacing:.15em;
    text-transform:uppercase;
  }
  footer{
    padding:26px 20px 38px;
    color:var(--muted);
    border-top:1px solid var(--line);
    text-align:center;
    font-size:.75rem;
  }
  footer a{color:var(--kit-dim);text-decoration:none;margin-left:14px}
  footer a:hover,footer a:focus-visible{color:var(--mint-deep)}
  @media(max-width:520px){
    main{padding-top:20px}
    .countries{grid-template-columns:1fr;max-width:320px}
    .country{min-height:190px}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="drop"><span class="mono">First drop · <b>limited</b> · Waitlist first</span></div>

<nav aria-label="JUPS">
  <a class="wordmark" href="/" aria-label="JUPS home">
    <img class="brandmark" src="https://cdn.shopify.com/s/files/1/0116/9788/1184/files/JUPS-wordmark-FINAL.svg?v=1787767305" alt="JUPS">
    <span class="disp performance">your<br>performance</span>
  </a>
</nav>

<main>
  <div class="eyebrow mono">Choose your country</div>
  <h1 class="disp">Where do you play?</h1>
  <p class="intro">Choose your country to open the right JUPS waitlist.</p>

  <figure class="product-hero">
    <img src="https://cdn.shopify.com/s/files/1/0116/9788/1184/files/jups-home-hero.jpg?v=1787767306" alt="White JUPS grip socks on football turf">
  </figure>

  <div class="countries" aria-label="Country selection">
    <a class="country" href="/waitlist" aria-label="Open the US waitlist">
      <span class="flag" aria-hidden="true">
        <svg viewBox="0 0 741 494" xmlns="http://www.w3.org/2000/svg">
          <rect width="741" height="494" fill="#fff"/>
          <g fill="#b22234">
            <rect width="741" height="38"/><rect y="76" width="741" height="38"/>
            <rect y="152" width="741" height="38"/><rect y="228" width="741" height="38"/>
            <rect y="304" width="741" height="38"/><rect y="380" width="741" height="38"/>
            <rect y="456" width="741" height="38"/>
          </g>
          <rect width="296" height="266" fill="#3c3b6e"/>
          <g fill="#fff">
            <circle cx="30" cy="28" r="7"/><circle cx="74" cy="28" r="7"/><circle cx="118" cy="28" r="7"/><circle cx="162" cy="28" r="7"/><circle cx="206" cy="28" r="7"/><circle cx="250" cy="28" r="7"/>
            <circle cx="52" cy="62" r="7"/><circle cx="96" cy="62" r="7"/><circle cx="140" cy="62" r="7"/><circle cx="184" cy="62" r="7"/><circle cx="228" cy="62" r="7"/><circle cx="272" cy="62" r="7"/>
            <circle cx="30" cy="96" r="7"/><circle cx="74" cy="96" r="7"/><circle cx="118" cy="96" r="7"/><circle cx="162" cy="96" r="7"/><circle cx="206" cy="96" r="7"/><circle cx="250" cy="96" r="7"/>
            <circle cx="52" cy="130" r="7"/><circle cx="96" cy="130" r="7"/><circle cx="140" cy="130" r="7"/><circle cx="184" cy="130" r="7"/><circle cx="228" cy="130" r="7"/><circle cx="272" cy="130" r="7"/>
            <circle cx="30" cy="164" r="7"/><circle cx="74" cy="164" r="7"/><circle cx="118" cy="164" r="7"/><circle cx="162" cy="164" r="7"/><circle cx="206" cy="164" r="7"/><circle cx="250" cy="164" r="7"/>
            <circle cx="52" cy="198" r="7"/><circle cx="96" cy="198" r="7"/><circle cx="140" cy="198" r="7"/><circle cx="184" cy="198" r="7"/><circle cx="228" cy="198" r="7"/><circle cx="272" cy="198" r="7"/>
            <circle cx="30" cy="232" r="7"/><circle cx="74" cy="232" r="7"/><circle cx="118" cy="232" r="7"/><circle cx="162" cy="232" r="7"/><circle cx="206" cy="232" r="7"/><circle cx="250" cy="232" r="7"/>
          </g>
        </svg>
      </span>
      <span class="disp country-name">US</span>
      <span class="arrow mono">Open waitlist →</span>
    </a>

    <a class="country" href="/warteliste" aria-label="Open the German waitlist">
      <span class="flag" aria-hidden="true">
        <svg viewBox="0 0 5 3" xmlns="http://www.w3.org/2000/svg">
          <path fill="#000" d="M0 0h5v1H0z"/>
          <path fill="#dd0000" d="M0 1h5v1H0z"/>
          <path fill="#ffce00" d="M0 2h5v1H0z"/>
        </svg>
      </span>
      <span class="disp country-name">Germany</span>
      <span class="arrow mono">Warteliste öffnen →</span>
    </a>
  </div>
</main>

<footer>JUPS is a brand of Nortys GmbH. <a href="/datenschutz">Datenschutz</a> <a href="/impressum">Impressum</a></footer>
</body>
</html>
